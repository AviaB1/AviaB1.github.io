name: Deploy Astro site to Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json already pins the Linux Rollup and sharp binaries
      - run: npm ci

      # Reuse optimized images from earlier runs. Bump astro-v1 whenever
      # src/lib/image-service.ts changes (its hash only covers the path)
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: astro-v1-${{ runner.os }}-

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
